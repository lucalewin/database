[package]
name = "viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.11.0", features = ["tree-sitter-sql"] }
keyring = { version = "3.6.3", features = [
    "sync-secret-service",
    "crypto-rust",
    "vendored",
    "apple-native",
    "windows-native",
] }
anyhow = "1.0.105"
futures-util = "0.3"
lsp-types = "0.97.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", features = [
    "runtime-tokio",
    "postgres",
    "tls-rustls-ring-native-roots",
] }
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
url = "2"
tracing = "0.1.44"
tree-sitter = "0.26.13"
tree-sitter-sequel = "0.3.13"
