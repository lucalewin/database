services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dbviewer
      POSTGRES_USER: dbviewer
      POSTGRES_PASSWORD: dbviewer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/10-sample.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbviewer -d dbviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
